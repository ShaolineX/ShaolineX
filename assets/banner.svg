<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131315"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8322A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B8322A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.46" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.74" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="land"><rect width="1280" height="400" fill="url(#fadeX)"/></mask>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E0E10" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>

    <style>
      .sans { font-family: Futura, 'Century Gothic', 'Avenir Next', Montserrat, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .f  { animation: fade 1.6s ease-out both; }
      .d1 { animation-delay: .1s; }  .d2 { animation-delay: .4s; }
      .d3 { animation-delay: .7s; }  .d4 { animation-delay: 1s; }
      .d5 { animation-delay: 1.3s; }
      .drift  { animation: drift 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
      @keyframes drift { from { transform: translateX(-50px); } to { transform: translateX(50px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base -->
    <rect width="1280" height="400" fill="url(#bg)"/>

    <!-- Landscape -->
    <g mask="url(#land)">
      <g class="f d1">
        <circle cx="1090" cy="150" r="150" fill="url(#sunGlow)"/>
        <circle cx="1090" cy="150" r="62" fill="#B8322A"/>
      </g>

      <g class="f d5" fill="none" stroke="#6B6660" stroke-width="1.6" stroke-linecap="round">
        <path d="M992,96 q6,-6 12,0 q6,-6 12,0"/>
        <path d="M1022,78 q4,-4 8,0 q4,-4 8,0"/>
        <path d="M972,118 q3,-3 6,0 q3,-3 6,0"/>
      </g>

      <path class="f d2" fill="#28272C"
        d="M560 300 C 660 270 740 205 830 230 S 960 140 1090 200 S 1190 160 1280 205 V400 H560 Z"/>
      <rect class="f d2" x="560" y="190" width="720" height="210" fill="url(#haze)"/>

      <g class="f d3">
        <ellipse class="drift" cx="960" cy="262" rx="260" ry="16" fill="#F2EEE6" opacity="0.05" filter="url(#soft)"/>
      </g>

      <path class="f d3" fill="#1B1B1E"
        d="M620 345 C 720 305 800 285 890 310 S 1030 255 1120 295 S 1230 275 1280 300 V400 H620 Z"/>

      <g class="f d4">
        <ellipse class="drift2" cx="1030" cy="330" rx="300" ry="14" fill="#F2EEE6" opacity="0.045" filter="url(#soft)"/>
      </g>

      <path class="f d4" fill="#111113"
        d="M560 385 C 680 355 800 348 910 370 S 1110 336 1280 362 V400 H560 Z"/>
    </g>

    <!-- Grain -->
    <rect width="1280" height="400" filter="url(#grain)" opacity="0.06"/>

    <!-- Top-left ornament -->
    <g class="f d1" fill="#E8E7E4">
      <path d="M67,50 L73,46 L73,94 L67,98 Z"/>
      <path d="M58,66 L82,62 L82,66 L58,70 Z"/>
      <path d="M70,31 L71.5,36.5 L77,38 L71.5,39.5 L70,45 L68.5,39.5 L63,38 L68.5,36.5 Z"/>
      <path d="M70,99 L71.5,104.5 L77,106 L71.5,107.5 L70,113 L68.5,107.5 L63,106 L68.5,104.5 Z"/>
    </g>

    <!-- Wordmark: blackletter SHAOLINE, centered -->
    <g class="f d2" fill="#F2EEE6">
      <!-- S -->
      <path d="M386,109 L408,95 L438,101 L438,113 L408,107 L400,115 Z"/>
      <path d="M378,111 L394,105 L394,157 L378,163 Z"/>
      <path d="M378,155 L394,151 L438,181 L422,187 Z"/>
      <path d="M422,183 L438,177 L438,233 L422,239 Z"/>
      <path d="M430,231 L408,245 L378,239 L378,227 L408,233 L416,225 Z"/>

      <!-- H -->
      <path d="M452,103 L468,95 L468,237 L452,245 Z"/>
      <path d="M496,103 L512,95 L512,237 L496,245 Z"/>
      <path d="M468,168 L496,160 L496,172 L468,180 Z"/>
      <rect x="459" y="76" width="2" height="24"/>
      <path d="M460,65 L461.5,70.5 L467,72 L461.5,73.5 L460,79 L458.5,73.5 L453,72 L458.5,70.5 Z"/>

      <!-- A -->
      <path d="M526,137 L542,129 L542,237 L526,245 Z"/>
      <path d="M570,103 L586,95 L586,237 L570,245 Z"/>
      <path d="M526,131 L578,95 L586,95 L586,109 L534,145 L526,145 Z"/>
      <path d="M542,178 L570,170 L570,182 L542,190 Z"/>

      <!-- O -->
      <path d="M600,115 L630,95 L660,115 L644,123 L630,113 L616,123 Z"/>
      <path d="M600,115 L616,115 L616,225 L600,225 Z"/>
      <path d="M644,115 L660,115 L660,225 L644,225 Z"/>
      <path d="M600,225 L616,217 L630,227 L644,217 L660,225 L630,245 Z"/>
      <rect x="629" y="245" width="2" height="16"/>
      <path d="M630,260 L631.3,264.7 L636,266 L631.3,267.3 L630,272 L628.7,267.3 L624,266 L628.7,264.7 Z"/>

      <!-- L -->
      <path d="M674,103 L690,95 L690,237 L674,245 Z"/>
      <path d="M690,229 L728,219 L728,233 L690,243 Z"/>

      <!-- I -->
      <path d="M742,103 L758,95 L758,237 L742,245 Z"/>
      <path d="M750,58 L752.6,67.4 L762,70 L752.6,72.6 L750,82 L747.4,72.6 L738,70 L747.4,67.4 Z"/>

      <!-- N -->
      <path d="M772,103 L788,95 L788,237 L772,245 Z"/>
      <path d="M816,125 L832,117 L832,237 L816,245 Z"/>
      <path d="M788,95 L802,95 L832,117 L816,125 L788,109 Z"/>
      <rect x="823" y="245" width="2" height="18"/>
      <path d="M824,261 L825.5,266.5 L831,268 L825.5,269.5 L824,275 L822.5,269.5 L817,268 L822.5,266.5 Z"/>

      <!-- E -->
      <path d="M846,115 L862,115 L862,225 L846,225 Z"/>
      <path d="M846,115 L876,95 L902,105 L902,117 L876,109 L862,123 Z"/>
      <path d="M862,167 L894,161 L894,173 L862,179 Z"/>
      <path d="M846,225 L862,217 L876,231 L902,223 L902,235 L876,245 Z"/>
    </g>

    <!-- Subtitle lockup: SOFTWARE ——— ENGINEER -->
    <g class="f d3">
      <text class="sans" x="378" y="304" font-size="15" letter-spacing="8" fill="#E8E7E4">SOFTWARE</text>
      <line x1="524" y1="299" x2="756" y2="299" stroke="#777674" stroke-width="1"/>
      <path d="M640,295 L644,299 L640,303 L636,299 Z" fill="#B8322A"/>
      <text class="sans" x="910" y="304" font-size="15" letter-spacing="8" text-anchor="end" fill="#E8E7E4">ENGINEER</text>
    </g>

    <!-- Bottom corners -->
    <text class="mono f d5" x="80" y="366" font-size="11" letter-spacing="3" fill="#6B6660">JAVA  ·  LINUX  ·  DISCORD.JS  ·  REACT</text>
    <text class="mono f d5" x="1200" y="366" font-size="11" letter-spacing="3" text-anchor="end" fill="#8A857E">YOUTUBE.COM/@SHAOLINE4X</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#2A2A2E"/>
</svg>
