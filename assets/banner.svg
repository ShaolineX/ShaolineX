<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131315"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8322A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B8322A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.46" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="land"><rect width="1280" height="400" fill="url(#fadeX)"/></mask>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E0E10" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8322A" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#B8322A" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#B8322A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B8322A" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>

    <style>
      .sans  { font-family: Futura, 'Century Gothic', 'Avenir Next', Montserrat, Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .f  { opacity: 0; animation: fade 1.6s ease-out forwards; }
      .d1 { animation-delay: .1s; }  .d2 { animation-delay: .4s; }
      .d3 { animation-delay: .7s; }  .d4 { animation-delay: 1s; }
      .d5 { animation-delay: 1.3s; }
      .drift  { animation: drift 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      @keyframes fade  { to { opacity: 1; } }
      @keyframes drift { from { transform: translateX(-50px); } to { transform: translateX(50px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base -->
    <rect width="1280" height="400" fill="url(#bg)"/>

    <!-- Landscape -->
    <g mask="url(#land)">
      <g class="f d1">
        <circle cx="1050" cy="150" r="150" fill="url(#sunGlow)"/>
        <circle cx="1050" cy="150" r="62" fill="#B8322A"/>
      </g>

      <g class="f d5" fill="none" stroke="#6B6660" stroke-width="1.6" stroke-linecap="round">
        <path d="M952,96 q6,-6 12,0 q6,-6 12,0"/>
        <path d="M982,78 q4,-4 8,0 q4,-4 8,0"/>
        <path d="M932,118 q3,-3 6,0 q3,-3 6,0"/>
      </g>

      <path class="f d2" fill="#28272C"
        d="M560 300 C 660 270 740 205 830 230 S 960 140 1050 200 S 1190 160 1280 205 V400 H560 Z"/>
      <rect class="f d2" x="560" y="190" width="720" height="210" fill="url(#haze)"/>

      <g class="f d3">
        <ellipse class="drift" cx="930" cy="262" rx="260" ry="16" fill="#F2EEE6" opacity="0.05" filter="url(#soft)"/>
      </g>

      <path class="f d3" fill="#1B1B1E"
        d="M620 345 C 720 305 800 285 890 310 S 1030 255 1120 295 S 1230 275 1280 300 V400 H620 Z"/>

      <g class="f d4">
        <ellipse class="drift2" cx="1010" cy="330" rx="300" ry="14" fill="#F2EEE6" opacity="0.045" filter="url(#soft)"/>
      </g>

      <path class="f d4" fill="#111113"
        d="M560 385 C 680 355 800 348 910 370 S 1110 336 1280 362 V400 H560 Z"/>
    </g>

    <!-- Grain -->
    <rect width="1280" height="400" filter="url(#grain)" opacity="0.06"/>

    <!-- Top label -->
    <text class="mono f d1" x="80" y="92" font-size="13" letter-spacing="5" fill="#A8A29A">FULL STACK  /  CREATOR</text>

    <!-- Wordmark: italic blade-cut SHAOLINE -->
    <g class="f d2" transform="translate(0 220) skewX(-14) translate(0 -220)">
      <g fill="#F2EEE6" fill-rule="evenodd">
        <!-- S -->
        <path d="M90,110 L136,110 L129,130 L100,130 L100,155 L126,155 L136,165 L136,210 L126,220 L80,220 L87,200 L116,200 L116,175 L90,175 L80,165 L80,120 Z"/>
        <!-- H -->
        <path d="M146,118 L166,110 L166,155 L182,155 L182,118 L202,110 L202,212 L182,220 L182,175 L166,175 L166,212 L146,220 Z"/>
        <!-- A -->
        <path d="M212,220 L212,140 L238,110 L268,110 L268,220 L248,220 L248,182 L232,182 L232,220 Z M232,162 L248,162 L248,130 L242,130 L232,142 Z"/>
        <!-- O -->
        <path d="M292,110 L334,110 L334,206 L320,220 L278,220 L278,124 Z M298,130 L314,130 L314,200 L298,200 Z"/>
        <!-- L -->
        <path d="M344,118 L364,110 L364,200 L400,200 L392,220 L344,220 Z"/>
        <!-- I -->
        <path d="M410,118 L430,110 L430,212 L410,220 Z"/>
        <!-- N -->
        <path d="M440,118 L460,110 L476,160 L476,118 L496,110 L496,212 L476,220 L460,170 L460,212 L440,220 Z"/>
        <!-- E -->
        <path d="M516,110 L562,110 L555,130 L526,130 L526,155 L550,155 L544,175 L526,175 L526,200 L562,200 L555,220 L506,220 L506,120 Z"/>
      </g>

      <!-- Katana slice through the letters -->
      <path d="M60,194 L620,146 L620,148 L60,199 Z" fill="#101012"/>
      <path d="M60,200 L620,149" stroke="url(#streak)" stroke-width="1.2"/>
    </g>

    <!-- Subtitle lockup: SOFTWARE ——— ENGINEER -->
    <g class="f d3">
      <text class="sans" x="80" y="262" font-size="14" letter-spacing="7" fill="#E8E7E4">SOFTWARE</text>
      <line x1="222" y1="257" x2="420" y2="257" stroke="#777674" stroke-width="1"/>
      <path d="M321,253 L325,257 L321,261 L317,257 Z" fill="#B8322A"/>
      <text class="sans" x="569" y="262" font-size="14" letter-spacing="7" text-anchor="end" fill="#E8E7E4">ENGINEER</text>
    </g>

    <!-- Tagline -->
    <text class="mono f d4" x="80" y="316" font-size="14" letter-spacing="0.5" fill="#A8A29A">Discord bots  ·  Web applications  ·  Backends  ·  Developer tools</text>

    <!-- Bottom meta -->
    <text class="mono f d5" x="80" y="362" font-size="11" letter-spacing="3" fill="#6B6660">JAVA  ·  LINUX  ·  DISCORD.JS  ·  REACT</text>
    <text class="mono f d5" x="1200" y="362" font-size="11" letter-spacing="3" text-anchor="end" fill="#8A857E">YOUTUBE.COM/@SHAOLINE4X</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#2A2A2E"/>
</svg>
