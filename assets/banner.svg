<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131315"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8322A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B8322A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="land"><rect width="1280" height="400" fill="url(#fadeX)"/></mask>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E0E10" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>

    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .f  { opacity: 0; animation: fade 1.6s ease-out forwards; }
      .d1 { animation-delay: .1s; }  .d2 { animation-delay: .4s; }
      .d3 { animation-delay: .7s; }  .d4 { animation-delay: 1s; }
      .d5 { animation-delay: 1.3s; }
      .drift  { animation: drift 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      @keyframes fade  { to { opacity: 1; } }
      @keyframes drift { from { transform: translateX(-50px); } to { transform: translateX(50px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base -->
    <rect width="1280" height="400" fill="url(#bg)"/>

    <!-- Landscape -->
    <g mask="url(#land)">
      <g class="f d1">
        <circle cx="1050" cy="150" r="150" fill="url(#sunGlow)"/>
        <circle cx="1050" cy="150" r="62" fill="#B8322A"/>
      </g>

      <path class="f d2" fill="#28272C"
        d="M560 300 C 660 270 740 205 830 230 S 960 140 1050 200 S 1190 160 1280 205 V400 H560 Z"/>
      <rect class="f d2" x="560" y="190" width="720" height="210" fill="url(#haze)"/>

      <g class="f d3">
        <ellipse class="drift" cx="930" cy="262" rx="260" ry="16" fill="#F2EEE6" opacity="0.05" filter="url(#soft)"/>
      </g>

      <path class="f d3" fill="#1B1B1E"
        d="M620 345 C 720 305 800 285 890 310 S 1030 255 1120 295 S 1230 275 1280 300 V400 H620 Z"/>

      <g class="f d4">
        <ellipse class="drift2" cx="1010" cy="330" rx="300" ry="14" fill="#F2EEE6" opacity="0.045" filter="url(#soft)"/>
      </g>

      <path class="f d4" fill="#111113"
        d="M560 385 C 680 355 800 348 910 370 S 1110 336 1280 362 V400 H560 Z"/>
    </g>

    <!-- Grain -->
    <rect width="1280" height="400" filter="url(#grain)" opacity="0.06"/>

    <!-- Type -->
    <text class="mono f d1" x="80" y="100" font-size="13" letter-spacing="5" fill="#A8A29A">SOFTWARE ENGINEER  /  FULL STACK  /  CREATOR</text>

    <text class="serif f d2" x="74" y="222" font-size="124" letter-spacing="-2" fill="#F2EEE6">Shaoline</text>

    <g class="f d3" transform="translate(578 160) rotate(-4)">
      <rect width="56" height="56" rx="5" fill="#B8322A"/>
      <rect x="5" y="5" width="46" height="46" rx="3" fill="none" stroke="#F2EEE6" stroke-opacity="0.6" stroke-width="1.5"/>
      <text class="serif" x="28" y="40" font-size="34" text-anchor="middle" fill="#F2EEE6">S</text>
    </g>

    <rect class="f d3" x="80" y="252" width="56" height="3" fill="#B8322A"/>

    <text class="mono f d4" x="80" y="300" font-size="15" letter-spacing="0.5" fill="#A8A29A">Discord bots  ·  Web applications  ·  Backends  ·  Developer tools</text>

    <text class="mono f d5" x="80" y="356" font-size="11" letter-spacing="3" fill="#6B6660">JAVA  ·  LINUX  ·  DISCORD.JS  ·  REACT</text>
    <text class="mono f d5" x="1200" y="356" font-size="11" letter-spacing="3" text-anchor="end" fill="#8A857E">YOUTUBE.COM/@SHAOLINE4X</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#2A2A2E"/>
</svg>
