name: YouTube Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UC2WHjPDvbE6O328n17ZGcfg
          max_videos: 4
          card_width: 250
          show_duration: true
          background_color: "#0E0E10"
          title_color: "#F2EEE6"
          stats_color: "#A8A29A"
